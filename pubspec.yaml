# Last full audit of the SDK and dependencies: 05.07.2026
name: application_base
description: "Unified base for Flutter applications"
version: 0.4.5
homepage: https://github.com/AlexSeednov/application_base

environment:
  # Minimum Flutter SDK. The packages it pins:
  # https://github.com/flutter/flutter/blob/3.44.4/packages/flutter/pubspec.yaml
  # Release notes: https://github.com/flutter/flutter/blob/stable/CHANGELOG.md
  flutter: '>=3.44.4'

  # Minimum Dart SDK. The one each Flutter release ships:
  # https://docs.flutter.dev/release/archive
  # Release notes: https://dart.googlesource.com/sdk/+/stable/CHANGELOG.md
  sdk: '>=3.12.2'

dependencies:
  # Not supported: Web
  #
  # Used only by the getit_check executable, never by lib/. A regular
  # dependency because a consumer's `dart run` sees no dev_dependencies of
  # this package. Held below 14 by injectable_generator (<14.0.0).
  analyzer: ^13.0.0

  # All platform supported
  auto_route: 11.1.0

  # All platform supported
  connectivity_plus: ^7.2.0

  # All platform supported
  cross_file: ^0.3.5+4

  # All platform supported
  flutter:
    sdk: flutter

  # All platform supported
  flutter_secure_storage: ^10.3.1

  # All platform supported
  get_it: ^9.2.1

  # All platform supported
  hive_ce: ^2.19.3

  # All platform supported
  hive_ce_flutter: ^2.3.4

  # All platform supported
  http: ^1.6.0

  # All platform supported
  #
  # JPEG encoding for HeifConverter outside the web: dart:ui encodes PNG only.
  # Pure Dart. The lower bound is kept low on purpose: every application on
  # this stack already has `image` through flutter_launcher_icons, some pin an
  # older 4.x, and a higher bound would break their resolution.
  image: ^4.5.4

  # Not supported: Linux | Web | Windows
  #
  # Opens the store listing for StoreService. Compiles everywhere: a platform
  # without an implementation registers no plugin, and the service checks the
  # platform before any call.
  in_app_review: ^2.0.12

  # All platform supported
  injectable: ^3.0.0

  # All platform supported
  #
  # A range, not an exact version: flutter_localizations pins intl to the one
  # its SDK ships, and an exact version here would fight that pin on every
  # Flutter upgrade.
  intl: ^0.20.2

  # All platform supported
  logger: ^2.7.0

  # All platform supported
  meta: ^1.18.0

  # All platform supported
  rxdart: ^0.28.0

  # All platform supported
  share_plus: ^13.2.0

  # All platform supported
  url_launcher: ^6.3.2

  # All platform supported
  #
  # Random identifiers of the records an application stores locally (UuidPro).
  uuid: ^4.6.0

  # Not supported: Android | iOS | Linux | macOS | Windows
  #
  # Browser API bindings, reached only through conditional imports
  # (`if (dart.library.js_interop)`), never imported directly.
  web: ^1.1.1

dev_dependencies:
  # dart run build_runner build
  build_runner: ^2.15.0

  #
  flutter_test:
    sdk: flutter

  # dart run build_runner build
  injectable_generator: ^3.1.0

# Run from a consumer's root: dart run application_base:<name>
executables:
  # Finds cyclic getIt dependencies, see the README
  getit_check:

flutter:
  assets:
    # heic-to, the HEIC decoder HeifConverter loads in browsers that cannot
    # decode HEIC themselves. Web only: other platforms decode HEIC with the
    # system codecs, and the three megabytes stay out of their bundles.
    - path: assets/heic_to/
      platforms: [web]
